[extend]
useDefault = true

[[allowlists]]
description = "Expired GitHub private-video embed JWTs in immutable upstream documentation; narrowly scoped to the two README paths."
paths = ['''^vendor/openmanusweb/README\.md$''', '''^vendor/openmanusweb/README_zh\.md$''']
regexTarget = "line"
regexes = ['''jwt=[A-Za-z0-9._-]{20,}''']
