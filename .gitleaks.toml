[extend]
useDefault = true

[[allowlists]]
description = "Allow only the known upstream GitHub private-video embed URL pattern in immutable README documentation; other secrets and files remain scanned."
paths = ['''^vendor/openmanusweb/README(_zh)?\.md$''']
regexTarget = "line"
regexes = ['''data-canonical-src=.*\.mp4\?jwt=''']
