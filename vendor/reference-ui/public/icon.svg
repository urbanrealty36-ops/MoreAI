  <circle cx="212" cy="232" r="6" fill="#FFFFFF"/>
  <ellipse cx="306" cy="240" rx="18" ry="24" fill="#171717"/>
  <circle cx="312" cy="232" r="6" fill="#FFFFFF"/>
  <!-- Cheeks -->
  <circle cx="178" cy="265" r="10" fill="#F9D8E5"/>
  <circle cx="334" cy="265" r="10" fill="#F9D8E5"/>
  <!-- Smile -->
  <path d="M236 265 Q256 285 276 265" stroke="#171717" stroke-width="8" stroke-linecap="round" fill="none"/>
  <!-- Sparkles on corner -->
