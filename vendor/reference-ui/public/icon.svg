  <polygon points="256,40 268,68 296,68 274,84 282,112 256,96 230,112 238,84 216,68 244,68" fill="#FBE7B2" stroke="#171717" stroke-width="6"/>
  <!-- Ears / Headphones -->
  <rect x="76" y="196" width="40" height="110" rx="20" fill="#D9D5FF" stroke="#171717" stroke-width="12"/>
  <rect x="396" y="196" width="40" height="110" rx="20" fill="#D9D5FF" stroke="#171717" stroke-width="12"/>
  <!-- Face Screen -->
  <rect x="156" y="176" width="200" height="150" rx="28" fill="#C9F2D5" stroke="#171717" stroke-width="10"/>
  <!-- Eyes -->
