[project]
name = "moreai-worker"
version = "0.2.0"
requires-python = ">=3.12"
dependencies = ["httpx==0.28.1", "pydantic==2.12.3", "openai==1.109.1"]

[project.optional-dependencies]
openmanus = [
  "tenacity==9.1.2", "pyyaml==6.0.3", "loguru==0.7.3",
  "numpy==2.3.4", "datasets==4.3.0", "html2text==2025.4.15",
  "gymnasium==1.2.2", "pillow==12.0.0", "browsergym==0.13.3",
  "unidiff==0.7.5", "browser-use==0.9.5", "googlesearch-python==1.3.0",
  "aiofiles==25.1.0", "colorama==0.4.6", "playwright==1.56.0",
  "jinja2==3.1.6", "websockets==15.0.1", "python-multipart==0.0.20",
  "watchdog==6.0.0", "fastapi==0.121.0"
]
dev = ["pytest==8.4.2", "ruff==0.14.3", "pytest-asyncio==1.2.0"]

[project.scripts]
moreai-worker = "moreai_worker.main:main"

[tool.uv]
package = true

[tool.pytest.ini_options]
asyncio_mode = "auto"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
