[project]
name = "moreai-worker"
version = "0.2.0"
requires-python = ">=3.12"
dependencies = [
  "httpx==0.28.1",
  "pydantic==2.12.3",
]

[project.optional-dependencies]
openmanus = [
  "openai==2.7.1",
  "tenacity==9.1.2",
  "browser-use==0.9.5",
  "playwright==1.56.0",
]
dev = ["pytest==8.4.2", "ruff==0.14.3", "pytest-asyncio==1.2.0"]

[project.scripts]
moreai-worker = "moreai_worker.main:main"

[tool.uv]
package = true

[tool.pytest.ini_options]
asyncio_mode = "auto"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
