[project]
name = "moreai-api"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["fastapi==0.121.0", "uvicorn[standard]==0.38.0", "pydantic-settings==2.11.0"]

[project.optional-dependencies]
dev = ["pytest==8.4.2", "httpx==0.28.1", "ruff==0.14.3"]

[tool.uv]
package = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
