name: Phase 02 One-time Python Formatting

on:
  push:
    branches:
      - phase-02-partner-api-operations
    paths:
      - "apps/**/*.py"
      - ".github/workflows/phase-02-format-branch.yml"

permissions:
  contents: write

jobs:
  format:
    if: "!contains(github.event.head_commit.message, '[skip format]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase-02-partner-api-operations
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --all-packages --all-extras --locked
      - run: uv run ruff format apps
      - name: Commit formatting
        run: |
          if [ -z "$(git status --porcelain apps)" ]; then
            echo "No formatting changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps
          git commit -m "style: format Phase 02 implementation [skip format]"
          git push origin HEAD:phase-02-partner-api-operations
