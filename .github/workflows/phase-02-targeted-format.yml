name: Phase 02 Targeted Python Formatting

on:
  push:
    branches:
      - phase-02-partner-api-operations
    paths:
      - "apps/api/src/moreai_api/routers/workspace.py"
      - "apps/api/tests/test_workspace.py"
      - ".github/workflows/phase-02-targeted-format.yml"

permissions:
  contents: write

jobs:
  format:
    if: "!contains(github.event.head_commit.message, '[skip format]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase-02-partner-api-operations
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --all-packages --all-extras --locked
      - run: uv run ruff format apps/api/src/moreai_api/routers/workspace.py apps/api/tests/test_workspace.py
      - name: Commit formatter output
        run: |
          if [ -z "$(git status --porcelain apps/api/src/moreai_api/routers/workspace.py apps/api/tests/test_workspace.py)" ]; then
            echo "No formatting changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/api/src/moreai_api/routers/workspace.py apps/api/tests/test_workspace.py
          git commit -m "style: format workspace API and tests [skip format]"
          git push origin HEAD:phase-02-partner-api-operations
