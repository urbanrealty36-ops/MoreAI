name: CI
on:
  pull_request:
  push:
    branches: [main, phase-01-monorepo-foundation, phase-02-source-migration]
concurrency:
  group: moreai-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
  security-events: write
  actions: read
  pull-requests: read
jobs:
  lockfiles:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}
      - uses: pnpm/action-setup@v4
        with:
          version: 10.20.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: astral-sh/setup-uv@v5
      - run: pnpm install --lockfile-only --ignore-scripts --frozen-lockfile
      - run: uv lock --check
      - run: uv sync --all-packages --all-extras --locked
      - run: uv run ruff format --check apps
  source-provenance:
    needs: lockfiles
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/verify-source-pins.py
  web-quality:
    needs: source-provenance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}
      - uses: pnpm/action-setup@v4
        with:
          version: 10.20.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
  python-quality:
    needs: source-provenance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --all-packages --all-extras --locked
      - run: uv run ruff check apps
      - run: uv run pytest
  dependency-review:
    if: github.event_name == 'pull_request'
    needs: lockfiles
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/dependency-review-action@v4
  security:
    needs: source-provenance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}
          fetch-depth: 0
      - uses: github/codeql-action/init@v3
        with:
          languages: javascript, python
      - uses: github/codeql-action/analyze@v3
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: pnpm/action-setup@v4
        with:
          version: 10.20.0
      - run: pnpm audit --audit-level high
      - uses: astral-sh/setup-uv@v5
      - name: Export Python runtime dependencies
        run: uv export --locked --no-dev --format requirements-txt --output-file /tmp/moreai-requirements.txt
      - name: Audit Python runtime dependencies
        run: uvx pip-audit -r /tmp/moreai-requirements.txt
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
